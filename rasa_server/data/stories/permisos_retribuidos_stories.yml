version: "3.1"

stories:

- story: consulta guiada - mudanza
  steps:
  - intent: consultar_permisos_retribuidos  # Usuario: "¿Qué permisos tengo?"
  - action: utter_preguntar_tipo_permiso # Usuario: ¿De qué tipo de permiso retribuido se trata? (mudanza, matrimonio, fallecimiento familiar, deber inexcusable, etc...)
  - intent: informar_permisos_retribuidos 
    entities:
    - tipo_permiso_retribuido: "mudanza"
  - slot_was_set:
    - tipo_permiso_retribuido: "mudanza"
  - action: utter_info_mudanza

