version: "3.1"

nlu:
- intent: greet
  examples: |
    - hola
    - buenas
    - buenos días
    - buenas tardes
    - holi
    - hey
    - qué tal
    - saludos
    - qué pasa
    - hola bot
    - buenos dias
    - hi

- intent: goodbye
  examples: |
    - Adios
    - Hasta luego
    - Me voy
    - Chao
