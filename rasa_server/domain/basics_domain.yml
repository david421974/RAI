version: "3.1"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
# Basics Intents
  - greet
  - goodbye
  - thankyou
# Specials Intents
  - out_of_scope
  - nlu_fallback

responses:
