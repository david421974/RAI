recipe: default.v1
language: es

pipeline:
# Cargamos Spacy
- name: SpacyNLP
  model: "es_core_news_lg"
  case_sensitive: False
  
# Usamos el tokenizador de Spacy (divide las frases mejor)
- name: SpacyTokenizer
  
# SpacyFeaturizer
# Convierte las palabras en vectores densos pre-entrenados.
# Aquí es donde el bot entiende que "rúcula" ~ "lechuga".
- name: SpacyFeaturizer
  pooling: mean
  
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 150
  constrain_similarities: true
  entity_recognition: true
# Si RegexEntityExtractore no está, no funcionará el lookup table como un diccionario estricto
- name: RegexEntityExtractor
  case_sensitive: False
  use_lookup_tables: True
- name: EntitySynonymMapper
- name: FallbackClassifier
  threshold: 0.70
  ambiguity_threshold: 0.10
- name: ResponseSelector
  epochs: 100
  constrain_similarities: true

policies: null
