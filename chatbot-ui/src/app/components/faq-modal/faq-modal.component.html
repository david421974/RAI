@if (visible) {
  <div class="modal-backdrop" (click)="onClose()"></div>
  <div class="modal-panel">
    <div class="modal-header">
      <h2 class="modal-title">Preguntas Frecuentes</h2>
      <button class="close-btn" (click)="onClose()" aria-label="Cerrar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="search-bar">
      <input
        type="text"
        class="search-input"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch()"
        placeholder="Buscar pregunta..."
      />
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>

    <div class="faq-list">
      @if (loading) {
        <div style="text-align: center; padding: 2rem; color: #666;">Cargando preguntas frecuentes...</div>
      } @else {
        @for (faq of filteredFaqs; track faq.payload) {
          <button class="faq-item" (click)="onSelect(faq)">
            {{ faq.question }}
          </button>
        }
        @if (filteredFaqs.length === 0) {
          <div style="text-align: center; padding: 2rem; color: #999;">No hay resultados para tu búsqueda.</div>
        }
      }
    </div>
  </div>
}
